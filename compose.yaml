name: father-infra

services:
  hermes:
    image: nousresearch/hermes-agent:stable
    container_name: father-hermes
    restart: unless-stopped
    command: ["gateway", "run"]
    shm_size: 1gb
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      TZ: "${TZ:-Etc/UTC}"
    volumes:
      - ./data/hermes:/opt/data
      - ./data/obsidian-vault:/vault
    mem_limit: 4g
    cpus: 2.0
    pids_limit: 512
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

